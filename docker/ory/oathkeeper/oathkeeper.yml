log:
  level: debug
  format: text

serve:
  api:
    port: 4456

access_rules:
  matching_strategy: regexp
  repositories:
    - file:///etc/config/authz/oathkeeper-rules.yml

errors:
  fallback:
    - json
  handlers:
    redirect:
      enabled: true
      config:
        to: http://kratos.${COMPOSE_DOMAIN}/self-service/login/browser
        when:
          - error: [unauthorized, forbidden]
            request:
              header:
                accept: [text/html]
    json:
      enabled: true
      config:
        verbose: true

authenticators:
  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      preserve_query: true
      subject_from: identity.id
      extra_from: "@this"
      only:
        - ory_kratos_session
  jwt:
    enabled: true
    config:
      jwks_urls:
        - http://hydra:4444/.well-known/jwks.json
      trusted_issuers:
        - http://hydra.${COMPOSE_DOMAIN}
      target_audience:
        - connection-manager-api
      # Hydra generates its JWT signing keysets lazily on first use, so the very
      # first machine-token validation blocks while Hydra does an RSA keygen.
      # On a busy, low-core host that keygen can exceed the 1s default and yield
      # a spurious 401. 5s covers the cold keygen; it only ever applies once,
      # since the keysets persist and subsequent JWKS fetches are cached.
      jwks_max_wait: 5s
  noop:
    enabled: true

authorizers:
  allow:
    enabled: true
  remote_json:
    enabled: true
    config:
      remote: http://decision:3002/
      payload: "{}"
      forward_response_headers_to_upstream:
        - X-Scope

mutators:
  noop:
    enabled: true
